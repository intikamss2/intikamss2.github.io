<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #ffffff;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    #taskForm {
      text-align: center;
      margin-bottom: 10px;
    }

    #taskForm input[type="text"] {
      width: 250px;
      padding: 5px;
      margin-right: 5px;
    }

    #taskForm select {
      padding: 5px;
      margin-right: 5px;
    }

    #taskForm label {
      margin-right: 10px;
      font-size: 0.95rem;
    }

    #taskForm button {
      padding: 5px 12px;
      cursor: pointer;
    }

    #error {
      text-align: center;
      color: red;
      min-height: 18px;
      font-size: 0.9rem;
      margin-top: 5px;
    }

    #taskmanager {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      margin-top: 15px;
      border-top: 1px solid #000;
    }

    .task-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-bottom: 1px solid #000;
      background-color: #ffffff;
      color: #000000;
    }

    .task-name {
      flex: 2;
      padding-right: 10px;
      word-break: break-word;
      font-size: 1rem;
    }

    .task-priority {
      flex: 1;
      font-size: 0.95rem;
    }

    .task-date {
      flex: 0 0 90px;
      text-align: right;
      font-size: 0.9rem;
      margin-right: 8px;
    }

    .task-actions {
      flex: 0 0 130px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      font-size: 0.9rem;
    }

    .task-actions button {
      padding: 3px 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Task Manager</h1>

  <form id="taskForm">
    <input type="text" id="taskName" placeholder="Task Name">
    <select id="taskPriority">
      <option value="High">High</option>
      <option value="Medium" selected>Medium</option>
      <option value="Low">Low</option>
    </select>

    <label>
      <input type="checkbox" id="taskImportant">
      Important
    </label>

    <button type="submit">Add Task</button>
  </form>

  <div id="error"></div>

  <div id="taskmanager"></div>

  <script>
    const tasks = [];
    let nextId = 1;

    const form = document.getElementById("taskForm");
    const nameInput = document.getElementById("taskName");
    const prioritySelect = document.getElementById("taskPriority");
    const importantCheckbox = document.getElementById("taskImportant");
    const taskManagerDiv = document.getElementById("taskmanager");
    const errorDiv = document.getElementById("error");

    function logTasks() {
      console.log(JSON.stringify(tasks));
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const name = nameInput.value.trim();
      const priority = prioritySelect.value;
      const isImportant = importantCheckbox.checked;

      if (name === "") {
        errorDiv.textContent = "Task name cannot be empty.";
        return;
      }
      errorDiv.textContent = "";

      const today = new Date().toLocaleDateString();

      const newTask = {
        id: nextId++,
        name: name,
        priority: priority,
        isImportant: isImportant,
        isCompleted: false,
        date: today
      };

      tasks.push(newTask);

      const rowHtml = `
        <div class="task-row" data-id="${newTask.id}">
          <div class="task-name">${newTask.name}</div>
          <div class="task-priority">Priority: ${newTask.priority.toLowerCase()}</div>
          <div class="task-date">${newTask.date}</div>
          <div class="task-actions">
            <label>
              <input type="checkbox" class="done-checkbox">
              Done
            </label>
            <button class="delete-btn">Delete</button>
          </div>
        </div>
      `;

      taskManagerDiv.innerHTML += rowHtml;

      const lastRow = taskManagerDiv.lastElementChild;
      const nameDiv = lastRow.querySelector(".task-name");
      const prioDiv = lastRow.querySelector(".task-priority");

      if (newTask.isImportant) {
        lastRow.style.backgroundColor = "red";
        lastRow.style.color = "#000000";
      }

      if (newTask.priority === "High") {
        prioDiv.style.fontWeight = "bold";
      } else if (newTask.priority === "Low") {
        prioDiv.style.opacity = "0.7";
      }

      nameInput.value = "";
      prioritySelect.value = "High";
      importantCheckbox.checked = false;

      logTasks();
    });

    taskManagerDiv.addEventListener("click", function (e) {
      if (e.target.classList.contains("delete-btn")) {
        const row = e.target.closest(".task-row");
        const id = parseInt(row.getAttribute("data-id"), 10);

        const index = tasks.findIndex(t => t.id === id);
        if (index !== -1) {
          tasks.splice(index, 1);
        }

        row.remove();
        logTasks();
      }
    });

    taskManagerDiv.addEventListener("change", function (e) {
      if (e.target.classList.contains("done-checkbox")) {
        const row = e.target.closest(".task-row");
        const id = parseInt(row.getAttribute("data-id"), 10);
        const task = tasks.find(t => t.id === id);
        const nameDiv = row.querySelector(".task-name");

        if (task) {
          task.isCompleted = e.target.checked;

          if (task.isCompleted) {
            nameDiv.style.textDecoration = "line-through";
          } else {
            nameDiv.style.textDecoration = "none";
          }

          logTasks();
        }
      }
    });
  </script>
</body>
</html>
